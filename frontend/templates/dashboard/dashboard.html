<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — NutriFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../../static/css/style.css">
</head>
<body>

    <div class="nf-layout">

        <aside class="nf-sidebar" id="nfSidebar">
            <div class="nf-sidebar-brand">
                <i class="bi bi-leaf-fill"></i>
                <span>NutriFlow</span>
            </div>

            <nav class="nf-nav">
                <a href="../dashboard/dashboard.html" class="nf-nav-link" data-nav="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a href="../forecast/forecast.html" class="nf-nav-link" data-nav="forecast">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Forecast</span>
                </a>
                <a href="../preparation/preparation.html" class="nf-nav-link" data-nav="preparation">
                    <i class="bi bi-egg-fried"></i>
                    <span>Preparation</span>
                </a>
                <a href="../surplus/surplus.html" class="nf-nav-link" data-nav="surplus">
                    <i class="bi bi-box-seam"></i>
                    <span>Surplus</span>
                </a>
                <a href="../recipients/recipients.html" class="nf-nav-link" data-nav="recipients">
                    <i class="bi bi-people-fill"></i>
                    <span>Recipients</span>
                </a>
                <a href="../pickups/pickups.html" class="nf-nav-link" data-nav="pickups">
                    <i class="bi bi-truck"></i>
                    <span>Pickups</span>
                </a>
                <a href="../impact/impact.html" class="nf-nav-link" data-nav="impact">
                    <i class="bi bi-heart-pulse-fill"></i>
                    <span>Impact</span>
                </a>
            </nav>

            <div class="nf-sidebar-footer">
                <a href="#" class="nf-nav-link" id="nfLogoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="nf-main">

            <header class="nf-topbar">
                <button class="nf-sidebar-toggle" id="nfSidebarToggle" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>

                <h1 class="nf-page-title" id="nfPageTitle">Dashboard</h1>

                <div class="nf-topbar-user">
                    <i class="bi bi-person-circle"></i>
                    <span id="nfUserDisplay">Account</span>
                </div>
            </header>

            <div class="nf-messages" id="nfMessages"></div>

            <main class="nf-content" id="nfContent">

                <div class="nf-card-subtitle" id="nfTodayDate" style="margin-bottom: 18px; font-size: 14px;"></div>

                <div class="nf-grid" style="margin-bottom: 24px;">
                    <div class="nf-stat-card">
                        <span class="nf-stat-label">Total Prepared</span>
                        <span class="nf-stat-value" id="nfStatPrepared">—<span class="unit">kg</span></span>
                    </div>
                    <div class="nf-stat-card">
                        <span class="nf-stat-label">Total Consumed</span>
                        <span class="nf-stat-value" id="nfStatConsumed">—<span class="unit">kg</span></span>
                    </div>
                    <div class="nf-stat-card">
                        <span class="nf-stat-label">Total Surplus</span>
                        <span class="nf-stat-value" id="nfStatSurplus">—<span class="unit">kg</span></span>
                    </div>
                    <div class="nf-stat-card">
                        <span class="nf-stat-label">Total Headcount</span>
                        <span class="nf-stat-value" id="nfStatHeadcount">—</span>
                    </div>
                </div>

                <div id="nfDashboardStatus"></div>

                <div class="nf-card" id="nfTableCard" style="display: none; padding: 0; overflow-x: auto;">
                    <table class="nf-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Session</th>
                                <th>Item</th>
                                <th>Prepared (kg)</th>
                                <th>Consumed (kg)</th>
                                <th>Surplus (kg)</th>
                                <th>Headcount</th>
                            </tr>
                        </thead>
                        <tbody id="nfLogsTableBody"></tbody>
                    </table>
                </div>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../static/js/main.js"></script>
    <script src="../../static/js/dashboard.js"></script>

</body>
</html>
