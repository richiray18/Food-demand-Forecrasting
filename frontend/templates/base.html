<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NutriFlow — Campus Food Demand & Surplus Rescue{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥣</text></svg>">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% csrf_token %}

    <div class="nf-layout">

        <!-- Sidebar Navigation -->
        <aside class="nf-sidebar" id="nfSidebar">
            <div class="nf-sidebar-brand">
                <i class="bi bi-cup-hot-fill"></i>
                <span>NutriFlow</span>
            </div>

            <nav class="nf-nav">
                <a href="/dashboard/" class="nf-nav-link" data-nav="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/forecast/" class="nf-nav-link" data-nav="forecast">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Forecast</span>
                </a>
                <a href="/preparation/" class="nf-nav-link" data-nav="preparation">
                    <i class="bi bi-egg-fried"></i>
                    <span>Preparation</span>
                </a>
                <a href="/surplus/" class="nf-nav-link" data-nav="surplus">
                    <i class="bi bi-box-seam"></i>
                    <span>Surplus</span>
                </a>
                <a href="/recipients/" class="nf-nav-link" data-nav="recipients">
                    <i class="bi bi-people-fill"></i>
                    <span>Recipients</span>
                </a>
                <a href="/pickups/" class="nf-nav-link" data-nav="pickups">
                    <i class="bi bi-truck"></i>
                    <span>Pickups</span>
                </a>
                <a href="/impact/" class="nf-nav-link" data-nav="impact">
                    <i class="bi bi-heart-pulse-fill"></i>
                    <span>Impact</span>
                </a>
            </nav>

            <div class="nf-sidebar-footer">
                <a href="#" class="nf-nav-link" id="nfLogoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Application View -->
        <div class="nf-main">

            <header class="nf-topbar">
                <button class="nf-sidebar-toggle" id="nfSidebarToggle" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>

                <h1 class="nf-page-title" id="nfPageTitle">{% block page_title %}Dashboard{% endblock %}</h1>

                <div class="nf-topbar-user">
                    <i class="bi bi-person-circle"></i>
                    <span id="nfUserDisplay">Staff Account</span>
                </div>
            </header>

            <div class="nf-messages" id="nfMessages"></div>

            <main class="nf-content" id="nfContent">
                {% block content %}{% endblock %}
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}

</body>
</html>
