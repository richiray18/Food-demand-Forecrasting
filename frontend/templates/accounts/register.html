<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account — NutriFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/forms.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥣</text></svg>">
</head>
<body style="background-color: var(--nf-canvas);">

    <div class="nf-auth-container">
        <div class="nf-auth-card" style="max-width: 520px;">
            <div class="nf-auth-brand">
                <i class="bi bi-cup-hot-fill"></i>
                <span>NutriFlow</span>
            </div>

            <div style="text-align: center; margin-bottom: 24px;">
                <h2 style="font-size: 24px; margin-bottom: 4px;">Register Partner Account</h2>
                <p style="color: var(--nf-ink-600); font-size: 14px; margin: 0;">Join the campus food demand & surplus rescue network</p>
            </div>

            <div id="registerMessages"></div>

            <form id="nfStandaloneRegisterForm" novalidate>
                {% csrf_token %}
                <div class="row g-2">
                    <div class="col-sm-6 nf-field">
                        <label for="regUsername">Account Username</label>
                        <input type="text" id="regUsername" placeholder="e.g. city_foodbank" required>
                    </div>
                    <div class="col-sm-6 nf-field">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" placeholder="contact@org.org" required>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-sm-6 nf-field">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="••••••••" required>
                    </div>
                    <div class="col-sm-6 nf-field">
                        <label for="regRole">Role</label>
                        <select id="regRole" required>
                            <option value="STAFF">Kitchen Operations Staff</option>
                            <option value="ADMIN">Campus Canteen Admin</option>
                            <option value="RECIPIENT">NGO Recipient Representative</option>
                        </select>
                    </div>
                </div>

                <div class="nf-field">
                    <label for="regOrgName">Organization / Dining Hall Name</label>
                    <input type="text" id="regOrgName" placeholder="e.g. City Care NGO or Hostel Dining 1" required>
                </div>

                <div class="nf-field">
                    <label for="regPhone">Contact Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="+91 98765 43210">
                </div>

                <button type="submit" class="nf-btn nf-btn-primary" style="width: 100%; padding: 12px;" id="regSubmitBtn">
                    Create Account & Access System <i class="bi bi-check-lg"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--nf-ink-600);">
                Already registered? <a href="/#login">Sign In</a>
                <br>
                <a href="/" style="display: inline-block; margin-top: 8px; color: var(--nf-ink-600);">
                    <i class="bi bi-arrow-left"></i> Back to Product Overview
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('nfStandaloneRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var user = document.getElementById('regUsername').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var pass = document.getElementById('regPassword').value;
            var role = document.getElementById('regRole').value;
            var org = document.getElementById('regOrgName').value.trim();
            var phone = document.getElementById('regPhone').value.trim();

            if (!user || !email || !pass || !org) {
                NutriFlow.showAlert('warning', 'Please fill in all required account fields.', 'registerMessages');
                return;
            }

            var btn = document.getElementById('regSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating account...';

            var payload = {
                username: user,
                email: email,
                password: pass,
                role: role,
                organization_name: org,
                phone_number: phone
            };

            NutriFlow.apiFetch('/api/v1/accounts/register/', {
                method: 'POST',
                body: payload
            })
            .then(function(res) {
                if (!res.ok) throw new Error('Registration failed. Username or email may already be registered.');
                return res.json();
            })
            .then(function() {
                NutriFlow.showAlert('success', 'Account created! Redirecting to login...', 'registerMessages');
                setTimeout(function() { window.location.href = '/#login'; }, 1500);
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.innerHTML = 'Create Account & Access System <i class="bi bi-check-lg"></i>';
                NutriFlow.showAlert('error', err.message, 'registerMessages');
            });
        });
    });
    </script>
</body>
</html>
