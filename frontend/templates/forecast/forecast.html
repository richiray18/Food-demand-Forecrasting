<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast — NutriFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="../../static/css/forecast.css">
</head>
<body>

    <div class="nf-layout">

        <aside class="nf-sidebar" id="nfSidebar">
            <div class="nf-sidebar-brand">
                <i class="bi bi-leaf-fill"></i>
                <span>NutriFlow</span>
            </div>

            <nav class="nf-nav">
                <a href="../dashboard/dashboard.html" class="nf-nav-link" data-nav="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a href="../forecast/forecast.html" class="nf-nav-link" data-nav="forecast">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Forecast</span>
                </a>
                <a href="../preparation/preparation.html" class="nf-nav-link" data-nav="preparation">
                    <i class="bi bi-egg-fried"></i>
                    <span>Preparation</span>
                </a>
                <a href="../surplus/surplus.html" class="nf-nav-link" data-nav="surplus">
                    <i class="bi bi-box-seam"></i>
                    <span>Surplus</span>
                </a>
                <a href="../recipients/recipients.html" class="nf-nav-link" data-nav="recipients">
                    <i class="bi bi-people-fill"></i>
                    <span>Recipients</span>
                </a>
                <a href="../pickups/pickups.html" class="nf-nav-link" data-nav="pickups">
                    <i class="bi bi-truck"></i>
                    <span>Pickups</span>
                </a>
                <a href="../impact/impact.html" class="nf-nav-link" data-nav="impact">
                    <i class="bi bi-heart-pulse-fill"></i>
                    <span>Impact</span>
                </a>
            </nav>

            <div class="nf-sidebar-footer">
                <a href="#" class="nf-nav-link" id="nfLogoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="nf-main">

            <header class="nf-topbar">
                <button class="nf-sidebar-toggle" id="nfSidebarToggle" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>

                <h1 class="nf-page-title" id="nfPageTitle">Forecast</h1>

                <div class="nf-topbar-user">
                    <i class="bi bi-person-circle"></i>
                    <span id="nfUserDisplay">Account</span>
                </div>
            </header>

            <div class="nf-messages" id="nfMessages"></div>

            <main class="nf-content" id="nfContent">

                <section class="nf-forecast-page">

                    <div class="nf-forecast-intro">
                        <h2 class="nf-forecast-heading">Food Demand Forecast</h2>
                        <p class="nf-forecast-subtext">
                            Estimate how much of a menu item to prepare for a given session and date,
                            based on historical demand patterns.
                        </p>
                    </div>

                    <div class="nf-card nf-forecast-form-card">
                        <form id="nfForecastForm" novalidate>

                            <div class="nf-forecast-grid">

                                <div class="nf-field">
                                    <label for="itemId">Menu Item ID <span class="nf-required">*</span></label>
                                    <input type="number" id="itemId" name="itemId" min="1" step="1" required
                                           aria-required="true" placeholder="e.g. 1">
                                </div>

                                <div class="nf-field">
                                    <label for="sessionId">Session <span class="nf-required">*</span></label>
                                    <select id="sessionId" name="sessionId" required aria-required="true">
                                        <option value="" selected disabled>Select session</option>
                                        <option value="1">Breakfast</option>
                                        <option value="2">Lunch</option>
                                        <option value="3">Snacks</option>
                                        <option value="4">Dinner</option>
                                    </select>
                                </div>

                                <div class="nf-field">
                                    <label for="forecastDate">Date <span class="nf-required">*</span></label>
                                    <input type="date" id="forecastDate" name="forecastDate" required aria-required="true">
                                </div>

                                <div class="nf-field">
                                    <label for="weatherNote">Weather Condition</label>
                                    <select id="weatherNote" name="weatherNote">
                                        <option value="">None</option>
                                        <option value="heavy rain">Heavy rain</option>
                                        <option value="extreme heat">Extreme heat</option>
                                        <option value="cold wave">Cold wave</option>
                                    </select>
                                </div>

                            </div>

                            <div class="nf-forecast-checkboxes">
                                <label class="nf-checkbox-label">
                                    <input type="checkbox" id="isHoliday" name="isHoliday">
                                    <span>Holiday</span>
                                </label>

                                <label class="nf-checkbox-label">
                                    <input type="checkbox" id="isExamPeriod" name="isExamPeriod">
                                    <span>Exam period</span>
                                </label>
                            </div>

                            <button type="submit" class="nf-btn nf-btn-primary" id="nfForecastBtn">
                                <span id="nfForecastBtnText">Generate Forecast</span>
                            </button>

                        </form>
                    </div>

                    <div id="nfForecastStatus" class="nf-forecast-status"></div>

                    <div class="nf-grid nf-forecast-results" id="nfForecastResults" style="display: none;">
                        <div class="nf-stat-card">
                            <span class="nf-stat-label">Baseline</span>
                            <span class="nf-stat-value" id="nfResultBaseline">—<span class="unit">kg</span></span>
                        </div>
                        <div class="nf-stat-card">
                            <span class="nf-stat-label">Recommended to Prepare</span>
                            <span class="nf-stat-value" id="nfResultRecommended">—<span class="unit">kg</span></span>
                        </div>
                        <div class="nf-stat-card">
                            <span class="nf-stat-label">Date</span>
                            <span class="nf-stat-value nf-stat-value-text" id="nfResultDate">—</span>
                        </div>
                        <div class="nf-stat-card">
                            <span class="nf-stat-label">Session</span>
                            <span class="nf-stat-value nf-stat-value-text" id="nfResultSession">—</span>
                        </div>
                    </div>

                </section>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../static/js/main.js"></script>
    <script src="../../static/js/forecast.js"></script>

</body>
</html>
